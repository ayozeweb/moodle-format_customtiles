name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
          MYSQL_COLLATION_SERVER: 'utf8mb4_unicode_ci'
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3307:3306
    strategy:
      fail-fast: false
      matrix:
        # The first combination runs every check; the others run the PHPUnit tests (install, upgrade,
        # queries and backup/restore are what depends on the PHP version and the database).
        include:
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'pgsql'
            db-port: '5432'
            full: true
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'mariadb'
            db-port: '3306'
            full: false
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            database: 'mysqli'
            db-port: '3307'
            full: false
    name: PHP ${{ matrix.php }} · ${{ matrix.database }}${{ matrix.full && ' · all checks' || '' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --db-port=${{ matrix.db-port }}
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() && matrix.full }}
        run: moodle-plugin-ci phplint

      - name: Validate plugin
        if: ${{ !cancelled() && matrix.full }}
        run: moodle-plugin-ci validate

      - name: Mustache Lint
        if: ${{ !cancelled() && matrix.full }}
        run: moodle-plugin-ci mustache

      - name: PHP Code Sniffer (moodle standard)
        if: ${{ !cancelled() && matrix.full }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Grunt (AMD build must match amd/src; lint JS and CSS)
        if: ${{ !cancelled() && matrix.full }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Compiled CSS is up to date with scss/
        if: ${{ !cancelled() && matrix.full }}
        run: |
          cd moodle/public/course/format/customtiles
          npm install --no-save --no-audit --no-fund sass@1.107.1
          ./build-css.sh
          cmp styles.css "$GITHUB_WORKSPACE/plugin/styles.css"

      - name: JavaScript unit tests (colour maths, parity with PHP)
        if: ${{ !cancelled() && matrix.full }}
        run: |
          cd plugin
          node --experimental-detect-module --test tests/js/*.test.mjs

      - name: PHPDoc Checker
        if: ${{ !cancelled() && matrix.full }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() && matrix.full }}
        run: moodle-plugin-ci behat --profile chrome
